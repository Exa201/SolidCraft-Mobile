name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "app/**"
      - "apps/solidcraft-android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "crates/**"
      - "vendor/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "app/**"
      - "apps/solidcraft-android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "crates/**"
      - "vendor/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Test Android host code and build APK
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify split APKs and signatures
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/debug"
          arm_apk="$apk_dir/app-arm64-v8a-debug.apk"
          x86_apk="$apk_dir/app-x86_64-debug.apk"
          test -f "$arm_apk"
          test -f "$x86_apk"
          apk_count=$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$apk_count" -eq 2

          for spec in "arm64-v8a:$arm_apk" "x86_64:$x86_apk"; do
            expected_abi=${spec%%:*}
            apk=${spec#*:}
            badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk")
            grep -q "^package: name='org.solidcraft.mobile'" <<<"$badging"
            actual_abi=$(sed -n 's/^native-code: //p' <<<"$badging")
            test "$actual_abi" = "'$expected_abi'"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: solidcraft-mobile-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
